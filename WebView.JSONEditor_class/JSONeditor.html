<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>JSONEditor | Load and save</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/jsoneditor/10.1.0/jsoneditor.css" rel="stylesheet" type="text/css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsoneditor/10.1.0/jsoneditor.min.js"></script>

  <style>
    html, body {
      font: 8pt sans-serif;
    }
    #jsoneditor {
      width: auto;
      height: 98vh; /* Set height to 100% of the viewport height */
      overflow: auto; /* Add scroll if content overflows */
    }

    .jsoneditor-autocomplete {
      background-color: #f0f0f0; /* Change background color */
      border: 1px solid #ccc; /* Change border color */
      font-size: 12px; /* Change font size */
      max-height: 200px; /* Set maximum height */
      overflow-y: auto; /* Add vertical scroll if content overflows */
    }

    .jsoneditor-autocomplete .jsoneditor-autocomplete-option {
      padding: 5px; /* Add padding to options */
      cursor: pointer; /* Change cursor to pointer */
    }



  </style>
</head>
<body>

<div id="jsoneditor"></div>

<script>
  var schema = {};

  var daq = {}

  var json ={};

  var options = {
      schema: schema,
      mode: 'form', 
      search: true,
      onChangeJSON: function(json) {
        console.log('change', json);
        // Send a webmessage with the new JSON
        try {
          window.chrome.webview.postMessage({ type: 'onChangeJSON', data: {name: editor.getName(), data: json} });
        } catch (error) {
          console.error('Error posting message:', error);
        }
      },
      onEvent: function(node, event) {
        //console.log('Node Path', node.path);
        try {
          window.chrome.webview.postMessage({ type: 'nodePath', path: node.path });
        } catch (error) {
          console.error('Error posting message:', error);
        }

      },
      autocomplete: { // autocomplete options
        filter: 'start', // filter the options for a dropdown by their start
        trigger: "focus", // show the dropdown when the editor is focused
        caseSensitive: false, // case sensitive options
        limit: 10,// maximum number of options to show in the dropdown
        getOptions: function(schema, path, input, editor) {
            // Print the name of the node
            console.log('Node name:', path);

            // Check if the name of the node is "Physical Channel"
            if (path[2] === "Physical Channel") {
            // return an array of valid options for the given path and input
            return ['foo', 'bar', 'baz'];
            }
            // Return an empty array if the node name is not "Physical Channel"
            return [];
          },
      },
  };  

  // create the editor
  var container = document.getElementById('jsoneditor');
  var editor = new JSONEditor(container, options, json);
  editor.expandAll();


  function getJsonEditorSize() {
    var jsoneditor = document.getElementById('jsoneditor');
    var rect = jsoneditor.getBoundingClientRect();
    return JSON.stringify(rect);
  }

  function loadJSON(jsonString, schemaString, expandAll) {
    try {
      // Parse and set the JSON data
      var jsonObject = JSON.parse(jsonString);
      editor.set(jsonObject);
      console.log("New JSON: ", jsonObject);

      // Set schema if provided
      if (schemaString && schemaString.trim() !== '') {
        var schemaObject = JSON.parse(schemaString);
        editor.setSchema(schemaObject);
        console.log("New Schema: ", schemaObject);
      }

      // Set the mode to form
      editor.setMode('form');
      
      // Expand all nodes if requested (defaults to false)
      if (expandAll === true) {
        editor.expandAll();
      }
    } catch (error) {
      console.error("Error loading JSON: ", error);
    }
  }

  // Function to change the editor mode
  function setEditorMode(mode) {
    try {
      // Validate mode parameter
      var validModes = ['tree', 'view', 'form', 'code', 'text', 'preview'];
      if (!validModes.includes(mode)) {
        console.error("Invalid mode. Valid modes are:", validModes);
        return false;
      }

      // Set the editor mode
      editor.setMode(mode);
      console.log("Editor mode changed to:", mode);
      return true;
    } catch (error) {
      console.error("Error changing editor mode:", error);
      return false;
    }
  }

</script>
</body>
</html>
